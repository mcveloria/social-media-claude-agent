name: publish-approved-posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually publish (false = dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Publish due approved posts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          # Scheduled runs are live only when the repo variable LIVE_PUBLISHING is "true".
          LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || vars.LIVE_PUBLISHING == 'true' }}
        run: |
          if [ "$LIVE" = "true" ]; then python -m socialposter run --live; else python -m socialposter run; fi
      - name: Record results
        if: always()
        run: |
          git config user.name "social-poster-bot"
          git config user.email "social-poster-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "Record publish results" && git pull --rebase && git push)
